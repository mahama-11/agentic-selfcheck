id: ecommerce-v2-platform-first-landing
project: v-workspace
description: Agent Ecommerce V2 platform-first docs/static acceptance for Platform P0 shared contracts, Ecommerce backend S1+S2 visualworkflow foundation, runtime-readiness integration, frontend stage-view contract consumption, and Ecommerce backend intent_spec/prompt_plan persistence evidence.
level_target: L3.5
repair_policy: default-repair-policy
depends_on:
- review-gates
target_services:
  platform_backend: platform-backend
  ecommerce_backend: ecommerce-backend
must_pass:
  static:
  - ecommerce-v2-platform-first-contract-doc-gate
  evidence:
  - evidence-gate
reviewer_gates:
- architect
- spec-review
- quality-review
- qa
- final-verification
human_required:
- Public or internal contract changes require architecture/spec approval before implementation is called done.
- Platform must not absorb product-specific visualworkflow semantics.
- Ecommerce must not duplicate platform truth for runtime, storage, quota, or metering.
- Provider, crawler, video, and inpainting production behavior remains out of scope for this tranche.
