id: menu-critical-journey-gates
project: v-workspace
description: "Menu P0/P1 critical journey quality gate wrapper: maps Menu backend/frontend/core smoke changes to the dedicated contract/evidence bridge, safe live smoke, selector coverage, and false-confidence evidence checks."
level_target: L3
repair_policy: default-repair-policy
depends_on:
  - review-gates
  - continuous-governance
target_services:
  menu_backend: menu-backend
  menu_frontend: menu-frontend
must_pass:
  static:
    - menu-critical-journey-gates-smoke
    - v-menu-contract-evidence-bridge-gate
  evidence:
    - v-menu-contract-evidence-bridge-evidence
reviewer_gates:
  - spec-review
  - quality-review
  - qa
  - final-verification
governance:
  rollout:
    product_lane: menu-critical-journeys
    real_smoke_upgrade: set V_RUN_MENU_REAL_CONTRACT_SMOKE=1 only in approved local/dev Menu+Platform lane with fixture token, write approval, and cleanup evidence
human_required:
  - Real Menu Studio smoke may create synthetic assets/jobs/history records; run only in local/dev or approved smoke lanes.
  - Prod write smoke and prod promotion remain approval-gated.
evidence_required:
  - /root/work/v/reports/evidence-contract/menu-studio-core-chain/latest.json
risk_dimensions:
  - menu-p0-critical-journeys
  - menu-studio-core-chain
  - contract-drift
  - platform-shared-consumer
  - auth-quota-runtime-callback
