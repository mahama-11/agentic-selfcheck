id: platform-financial-consistency-baseline
project: v-workspace
description: "Platform Phase-3 financial-consistency focused baseline for wallet, metering, billing, commercial/catalog, settlement, quota, and incentive regressions."
level_target: L4
repair_policy: default-repair-policy
depends_on:
  - review-gates
  - continuous-governance
target_services:
  platform: platform-backend
must_pass:
  static:
    - platform-financial-consistency-baseline-static
reviewer_gates:
  - architect
  - spec-review
  - quality-review
  - qa
  - final-verification
governance:
  contract:
    phase: platform-phase-3-selfcheck-hardening
    scanner_profile: financial
    required_scanners:
      - product_hardcode_classifier
      - service_raw_db_expansion_scanner
      - raw_status_write_scanner
      - route_openapi_drift_check
    focus:
      - wallet_ledger_and_balance_invariants
      - metering_to_billing_charge_trace
      - catalog_commercial_rate_card_consistency
      - quota_settlement_incentive_auditability
    fail_closed:
      - NEEDS_REPAIR
      - NEEDS_HUMAN
      - critical_finding
      - error_finding
human_required:
  - Financial route/handler changes without internal contract references require platform architect review.
  - Wallet/metering/billing/commercial/catalog/quota changes must preserve traceability and auditability.
# Evidence paths below are project-relative. For project `v-workspace`,
# SelfCheck resolves `reports/...` under `/root/work/v`, not this SelfCheck checkout.
evidence_required:
  - reports/platform-financial-consistency-baseline/platform-financial-consistency-baseline.json
