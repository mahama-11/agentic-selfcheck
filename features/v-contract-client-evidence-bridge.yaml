id: v-contract-client-evidence-bridge
project: v-workspace
description: "Bridge Ecommerce OpenAPI/generated-client drift and optional real contract smoke into V Evidence Contract output; Menu coverage is enforced by the foundation evidence contract until a dedicated Menu bridge is split out."
level_target: L3
repair_policy: default-repair-policy
depends_on:
  - review-gates
  - continuous-governance
target_services:
  frontend: ecommerce-frontend
must_pass:
  static:
    - v-contract-client-evidence-bridge-smoke
    - v-contract-client-evidence-bridge-gate
  evidence:
    - v-contract-client-evidence-bridge-evidence
reviewer_gates:
  - spec-review
  - quality-review
  - qa
  - final-verification
governance:
  rollout:
    menu_included_by_foundation: true
    real_smoke_upgrade: set V_RUN_REAL_CONTRACT_SMOKE=1 with local/dev Ecommerce services and auth
human_required:
  - Real API smoke may create synthetic product records; run only in local/dev or approved smoke lanes.
  - Prod deploy/promote remains approval-gated.
evidence_required:
  - /root/work/v/reports/evidence-contract/ecommerce-v1-contract-client/latest.json
risk_dimensions:
  - contract-drift
  - generated-client
  - ecommerce-v1-sellable-closure
