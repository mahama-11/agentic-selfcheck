id: platform-ops-visible-baseline
project: v-workspace
description: "Platform Ops visibility baseline: Template Ops Ecommerce projections, Catalog & Assets Ecommerce commercial data, audit diagnostics queryability, and vendor-neutral business-log diagnostics readiness."
level_target: L4
repair_policy: default-repair-policy
depends_on:
  - review-gates
  - frontend-runtime
target_services:
  platform: platform-backend
  backend: ecommerce-backend
  frontend: platform-frontend
must_pass:
  api:
    - platform-ops-visible-baseline-gate
  evidence:
    - evidence-gate
reviewer_gates:
  - architect
  - spec-review
  - quality-review
  - qa
  - final-verification
human_required:
  - Platform must not contain Ecommerce workflow state or frontend fake rows.
  - Browser QA should separately confirm Template Ops, Catalog & Assets, and Audit Diagnostics visible data.
  - Audit Diagnostics must expose business audit facts, correlation IDs, and configured external log/trace entry points; raw access-log persistence in business DB is not allowed.
  - Business-log diagnostics must preserve a backend-neutral JSON stdout contract and configurable URL/provider boundaries so Loki can be replaced by ELK/OpenSearch/ClickHouse later.
evidence_required:
  - reports/platform-ops-visible-baseline/platform-ops-visible-baseline-gate.json
  - .hermes/workflows/platform-ops-visible-baseline/01-requirement.md
  - .hermes/workflows/platform-ops-visible-baseline/02-architecture-review.md
  - .hermes/workflows/platform-ops-visible-baseline/04-developer-summary.md
