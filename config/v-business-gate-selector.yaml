version: 1
project: v-workspace
description: >-
  V workspace changed-file to business SelfCheck feature gate selector. Generic
  governance events are not sufficient for product-critical Ecommerce changes;
  this selector maps touched surfaces to required business feature gates.
features:
  ecommerce-v2-prep-sandbox-lowlevel:
    event: requirement.changed.v.ecommerce-v2-prep-sandbox-lowlevel
    groups: static,api,browser,evidence
    command: scripts/v-requirement-gate.sh ecommerce-v2-prep-sandbox-lowlevel static,api,browser,evidence requirement.changed.v.ecommerce-v2-prep-sandbox-lowlevel
    blocking: true
    reason: Prep/Sandbox/prompt low-level regression gate
  ecommerce-critical-journey-release-gate:
    event: release.v.ecommerce
    groups: static,api,browser,evidence
    command: scripts/requirement-gate.sh ecommerce-critical-journey-release-gate static,api,browser,evidence release.v.ecommerce
    blocking: true
    reason: Ecommerce release-wide critical journey gate
  ecommerce-v1-listing-export-gate:
    event: requirement.changed.v.ecommerce-v1-listing-export
    groups: static
    command: scripts/requirement-gate.sh ecommerce-v1-listing-export-gate static requirement.changed.v.ecommerce-v1-listing-export
    blocking: true
    reason: Ecommerce listing/export active-slice quarantine/readiness gate until full same-run evidence exists.
  ecommerce-large-source-locality-guard:
    event: governance.changed.v.ecommerce-large-source-locality
    groups: static
    command: scripts/v_ecommerce_large_source_guard.py --format json
    blocking: true
    reason: Prevent new or growing oversized Ecommerce source files while the legacy split plan is being burned down.
  platform-ops-visible-baseline:
    event: requirement.changed.v.platform-ops-visible-baseline
    groups: api,evidence
    command: scripts/requirement-gate.sh platform-ops-visible-baseline api,evidence requirement.changed.v.platform-ops-visible-baseline
    blocking: true
    reason: Platform shared capability baseline gate for ops-visible catalog/template/commercial/runtime-adjacent regressions
  platform-core-engineering-baseline:
    event: requirement.changed.v.platform-core-engineering-baseline
    groups: static
    command: scripts/requirement-gate.sh platform-core-engineering-baseline static requirement.changed.v.platform-core-engineering-baseline
    blocking: true
    reason: Platform Phase-1/2/3 engineering hardening gate for state/idempotency/product-boundary/raw-DB/route-contract regressions
  platform-runtime-state-machine-baseline:
    event: requirement.changed.v.platform-runtime-state-machine-baseline
    groups: static
    command: scripts/requirement-gate.sh platform-runtime-state-machine-baseline static requirement.changed.v.platform-runtime-state-machine-baseline
    blocking: true
    reason: Platform Phase-3 runtime job/session/provider/callback/idempotency/status-transition focused gate
  platform-runtime-business-integration-safety:
    event: requirement.changed.v.platform-runtime-business-integration-safety
    groups: static
    command: scripts/requirement-gate.sh platform-runtime-business-integration-safety static requirement.changed.v.platform-runtime-business-integration-safety
    blocking: true
    reason: Platform runtime product-facing business integration safety gate for dispatch/provider/fallback/callback/charge compatibility
  platform-financial-consistency-baseline:
    event: requirement.changed.v.platform-financial-consistency-baseline
    groups: static
    command: scripts/requirement-gate.sh platform-financial-consistency-baseline static requirement.changed.v.platform-financial-consistency-baseline
    blocking: true
    reason: Platform Phase-3 wallet/metering/billing/commercial/catalog/quota/incentive focused gate
  platform-financial-business-consistency:
    event: requirement.changed.v.platform-financial-business-consistency
    groups: static
    command: scripts/requirement-gate.sh platform-financial-business-consistency static requirement.changed.v.platform-financial-business-consistency
    blocking: true
    reason: Platform financial business-path consistency gate for wallet/metering/billing/quota/control/runtime charge/commercial/catalog/incentive invariants
rules:
  - id: ecommerce-large-source-locality-surfaces
    description: Any Ecommerce source/docs change should keep the no-new-large-source guard active until the split backlog is cleared.
    patterns:
      - ecommerce-backend/**
      - ecommerce-frontend/**
      - docs/ecommerce/**
      - docs/plans/*ecommerce*large*source*.md
    gates:
      - ecommerce-large-source-locality-guard
  - id: ecommerce-production-frontend-lowlevel
    description: Ecommerce production pages can affect Prep/Sandbox/Workshop prompt and generation flow.
    patterns:
      - ecommerce-frontend/src/pages/production/**
      - ecommerce-frontend/src/services/production.ts
      - ecommerce-frontend/src/store/productionStore.ts
      - ecommerce-frontend/src/i18n/**
    gates:
      - ecommerce-v2-prep-sandbox-lowlevel
  - id: ecommerce-visualworkflow-lowlevel
    description: Visual workflow backend owns Prep/Sandbox prompt composition, source refs, generation state, and callbacks.
    patterns:
      - ecommerce-backend/internal/modules/visualworkflow/**
    gates:
      - ecommerce-v2-prep-sandbox-lowlevel
  - id: platform-core-shared-capability-surfaces
    description: Platform is a shared dependency; changes to core shared modules must run a Platform baseline gate, not only downstream product gates.
    patterns:
      - platform-backend/internal/modules/runtime/**
      - platform-backend/internal/modules/wallet/**
      - platform-backend/internal/modules/metering/**
      - platform-backend/internal/modules/billing/**
      - platform-backend/internal/modules/storage/**
      - platform-backend/internal/modules/auth/**
      - platform-backend/internal/modules/identity/**
      - platform-backend/internal/modules/access/**
      - platform-backend/internal/modules/catalog/**
      - platform-backend/internal/modules/commercial/**
      - platform-backend/internal/modules/templateops/**
      - platform-backend/docs/architecture/**
      - platform-backend/docs/PROD_DEPLOY_RUNBOOK.md
      - platform-frontend/src/**
    gates:
      - platform-core-engineering-baseline
      - platform-ops-visible-baseline
  - id: platform-runtime-state-machine-surfaces
    description: Runtime job/session/provider/callback/idempotency/status-transition changes require the dedicated Phase-3 runtime baseline and business-integration safety gate in addition to the core Platform baseline.
    patterns:
      - platform-backend/internal/modules/runtime/**
      - platform-backend/internal/router/**
      - platform-backend/internal/routes/**
    gates:
      - platform-runtime-state-machine-baseline
      - platform-runtime-business-integration-safety
  - id: platform-financial-consistency-surfaces
    description: Wallet/metering/billing/commercial/catalog/quota/incentive changes require the dedicated Phase-3 financial consistency baseline and financial business-path consistency gate in addition to the core Platform baseline.
    patterns:
      - platform-backend/internal/modules/wallet/**
      - platform-backend/internal/modules/metering/**
      - platform-backend/internal/modules/billing/**
      - platform-backend/internal/modules/commercial/**
      - platform-backend/internal/modules/catalog/**
      - platform-backend/internal/modules/quota/**
      - platform-backend/internal/modules/incentive/**
    gates:
      - platform-financial-consistency-baseline
      - platform-financial-business-consistency
  - id: platform-financial-runtime-charge-surfaces
    description: Runtime charge-session adjacent changes affect financial settlement and must run the financial business-path consistency gate alongside runtime gates.
    patterns:
      - platform-backend/internal/modules/runtime/**
      - platform-backend/internal/modules/control/**
    gates:
      - platform-financial-business-consistency
  - id: ecommerce-release-critical-surfaces
    description: Ecommerce product/runtime surfaces can break auth, SKU, generation, listing/export, delivery, or commercial journeys.
    patterns:
      - ecommerce-frontend/src/pages/production/**
      - ecommerce-frontend/src/services/production.ts
      - ecommerce-frontend/src/store/productionStore.ts
      - ecommerce-backend/internal/modules/visualworkflow/**
      - ecommerce-backend/internal/modules/productcore/**
      - ecommerce-backend/internal/modules/templatecenter/**
      - ecommerce-backend/internal/modules/commercial/**
      - ecommerce-backend/internal/modules/delivery/**
      - platform-backend/internal/modules/runtime/**
      - platform-backend/internal/modules/wallet/**
      - platform-backend/internal/modules/metering/**
      - platform-backend/internal/modules/billing/**
      - platform-backend/internal/modules/storage/**
      - platform-backend/internal/modules/commercial/**
      - platform-backend/internal/modules/catalog/**
      - platform-backend/internal/modules/auth/**
    gates:
      - ecommerce-critical-journey-release-gate
  - id: ecommerce-prod-deploy-runbooks
    description: Explicit Ecommerce deploy/release artifacts must prove release-wide journey evidence.
    patterns:
      - ecommerce-frontend/**/PROD_DEPLOY_RUNBOOK.md
      - ecommerce-backend/**/PROD_DEPLOY_RUNBOOK.md
      - docs/**/PROD_DEPLOY_RUNBOOK.md
      - events/release-v-ecommerce.yaml
    gates:
      - ecommerce-critical-journey-release-gate
  - id: ecommerce-listing-export-surfaces
    description: ProductCore/listing/export/image-runtime and product detail UI changes require the dedicated listing/export quarantine/readiness gate until full same-run evidence exists.
    patterns:
      - ecommerce-backend/internal/modules/productcore/**
      - ecommerce-backend/internal/modules/imageruntime/**
      - ecommerce-backend/internal/modules/templatecenter/**
      - ecommerce-backend/internal/repository/productcenter_repository.go
      - ecommerce-backend/internal/models/productcenter.go
      - ecommerce-backend/internal/migration/**
      - ecommerce-frontend/src/pages/product/**
      - ecommerce-frontend/src/services/product.ts
      - ecommerce-frontend/src/services/imageRuntime.ts
      - ecommerce-frontend/src/types/product.ts
    gates:
      - ecommerce-v1-listing-export-gate
