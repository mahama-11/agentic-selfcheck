id: changed-v-platform-financial-business-consistency
event: requirement.changed.v.platform-financial-business-consistency
description: Gate Platform financial business-path changes through wallet/metering/billing/quota/control/runtime charge/commercial/catalog/incentive consistency checks.
feature: platform-financial-business-consistency
groups:
  - static
mode: event
strict_audit: true
allowed_sources:
  - local
  - git-hook
  - ci-webhook
  - hermes-webhook
  - cron
debounce_seconds: 15
human_escalation:
  - verifier_failure_after_retry
  - missing_required_evidence
  - financial_business_consistency_or_auditability
  - wallet_metering_billing_quota_or_charge_contract_drift
